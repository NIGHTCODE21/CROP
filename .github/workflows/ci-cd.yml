name: CROP CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: |
          echo "Checking for index.html..."
          test -f index.html
          echo "index.html found successfully."

      - name: Validate HTML structure
        run: |
          echo "Validating HTML..."
          grep -qi "<html" index.html
          grep -qi "<head" index.html
          grep -qi "<body" index.html
          grep -qi "</html>" index.html
          echo "HTML validation successful."

      - name: Check required content
        run: |
          echo "Checking page content..."
          test -s index.html
          echo "index.html is not empty."
          echo "All CI checks passed."

  cd:
    name: Continuous Deployment
    needs: ci
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir public
          cp index.html public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
