name: Raju Hisaab CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Checking project files..."
          test -f index.html
          echo "index.html exists."

      - name: Validate HTML structure
        run: |
          echo "Validating HTML structure..."

          grep -qi "<!DOCTYPE html>" index.html
          grep -qi "<html" index.html
          grep -qi "<head" index.html
          grep -qi "<body" index.html
          grep -qi "<script" index.html
          grep -qi "</script>" index.html
          grep -qi "</html>" index.html

          echo "HTML structure validation passed."

      - name: Validate application content
        run: |
          echo "Checking application content..."

          grep -qi "Raju Hisaab" index.html
          grep -qi "Add Crop" index.html
          grep -qi "Add Expense" index.html
          grep -qi "Export Data" index.html
          grep -qi "Import Data" index.html

          echo "Application content validation passed."

      - name: Validate JavaScript functionality
        run: |
          echo "Checking JavaScript functions..."

          grep -q "localStorage" index.html
          grep -q "calculateTotals" index.html
          grep -q "renderCrops" index.html
          grep -q "saveData" index.html
          grep -q "generateId" index.html

          echo "JavaScript validation passed."

      - name: CI successful
        run: echo "All Continuous Integration checks passed successfully!"

  continuous-deployment:
    name: Continuous Deployment
    needs: continuous-integration
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir public
          cp index.html public/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
